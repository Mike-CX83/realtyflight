[project]
name = "drone-mission"
version = "0.1.0"
description = "Governed natural-language real-estate photography drone: typed missions, deterministic validation, human approval, simulator-first execution."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "shapely>=2.0",
    "pymap3d>=3.0",
    "python-statemachine>=3.0",
    "pydantic-ai-slim>=2.0",  # add provider extras at runtime, e.g. pydantic-ai-slim[anthropic]
    "mavsdk>=3.0",            # PX4 backend (bundles mavsdk_server incl. macOS arm64)
    "fastapi>=0.115",         # D11 dashboard server (docs 14 §1)
    "uvicorn>=0.30",          # ASGI server for the dashboard
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",   # FastAPI TestClient transport for tests/test_server.py
    "pydantic-evals>=2.0",  # planner eval harness (evals/; versioned with pydantic-ai)
]
camera = [
    "opencv-python>=4.9",  # only needed for PX4Backend camera_mode="rtsp"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "backends*", "planner*", "server*", "demo*", "context*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC", "PERF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
